name: Build Bomberman2P.g3a

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            curl git python3 build-essential cmake pkg-config \
            python3-pil libusb-1.0-0-dev libudev-dev libsdl2-dev \
            libpng-dev libudisks2-dev libglib2.0-dev \
            libmpfr-dev libmpc-dev libppl-dev

      - name: Cache toolchain + gint
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: fxsdk-gint-v1

      - name: Install toolchain + gint via GiteaPC
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          git clone --depth=1 https://git.planet-casio.com/Lephenixnoir/GiteaPC /tmp/GiteaPC
          cd /tmp/GiteaPC
          python3 giteapc.py install Lephenixnoir/GiteaPC -y
          giteapc install Lephenixnoir/fxsdk:noudisks2 \
                         Lephenixnoir/sh-elf-binutils \
                         Lephenixnoir/sh-elf-gcc -y
          giteapc install Lephenixnoir/OpenLibm \
                         Vhex-Kernel-Core/fxlibc \
                         Lephenixnoir/sh-elf-gcc -y
          giteapc install Lephenixnoir/gint -y

      - name: Add fxsdk to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build add-in
        run: |
          fxsdk build-cg -j$(nproc)
          # generate_g3a is a custom CMake target — build it explicitly
          cmake --build build-cg --target Bomberman2P.g3a 2>/dev/null || true
          # Show what was produced so we can fix the path if needed
          find build-cg -name "*.g3a" -o -name "*.bin" | head -10
          find . -maxdepth 3 -name "*.g3a" | head -10

      - name: Upload Bomberman2P.g3a
        uses: actions/upload-artifact@v4
        with:
          name: Bomberman2P.g3a
          path: "**/*.g3a"
          if-no-files-found: error
